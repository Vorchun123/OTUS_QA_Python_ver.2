version: '3.9'

services: 
  selenoid1:
    image: aerokube/selenoid:1.11.3
    environment:
      - DOCKER_API_VERSION=1.40
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/d/Учеба/OTUS/OTUS_QA_Python_ver.2/docker_selenoid/browsers.json:/etc/selenoid/browsers.json:ro
    hostname: selenoid1
    ports:
      - "4444:4444"
    networks: 
      - selenoid1
    command: -container-network selenoid1

  selenoid2:
    image: aerokube/selenoid:1.11.3
    environment:
      - DOCKER_API_VERSION=1.40
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/d/Учеба/OTUS/OTUS_QA_Python_ver.2/docker_selenoid/browsers.json:/etc/selenoid/browsers.json:ro
    hostname: selenoid2
    ports: 
      - "4445:4444"
    networks: 
      - selenoid2
    command: -container-network selenoid2

  ggr:
    image: aerokube/ggr:1.7.2
    volumes:
      - /mnt/d/Учеба/OTUS/OTUS_QA_Python_ver.2/docker_selenoid/grid-router:/etc/grid-router:ro
    hostname: ggr
    ports:
      - "8889:8888"
    depends_on:
      - selenoid1
      - selenoid2
    networks:
      - selenoid1
      - selenoid2

  ggr_ui:
    image: aerokube/ggr-ui:latest-release
    volumes:
      - /mnt/d/Учеба/OTUS/OTUS_QA_Python_ver.2/docker_selenoid/grid-router/quota:/etc/grid-router/quota:ro
    hostname: ggr-ui
    ports:
      - "8080:8888"
    networks:
      - selenoid1
      - selenoid2
    depends_on:
      - selenoid1
      - selenoid2

  selenoid_ui:
    image: aerokube/selenoid-ui:1.10.11
    hostname: selenoid_ui
    ports:
      - "8090:8080"
    command: --selenoid-uri http://selenoid1:4444
    depends_on:
      - ggr_ui
    networks:
      - selenoid1

  nginx:
    image: nginx:stable-alpine3.24-perl
    hostname: nginx
    ports: 
      - 80:80
    volumes:
      - /mnt/d/Учеба/OTUS/OTUS_QA_Python_ver.2/docker_selenoid/nginx/selenoid.conf:/etc/nginx/conf.d/selenoid.conf:ro
    networks:
      - selenoid1
    depends_on:
      - selenoid_ui
      - ggr

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      PMA_USER: root
      PMA_PASSWORD: admin
    ports:
      - "8888:80"
    depends_on:
      db:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - selenoid1

  db:
    image: mysql:5.7
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: prestashop
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - selenoid1

  prestashop:
    image: prestashop/prestashop:8.1.5
    container_name: prestashop
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: admin
      DB_PREFIX: ps_
      PS_INSTALL_AUTO: "1"
      PS_LANGUAGE: "en"
      PS_COUNTRY: "US"
      PS_DEV_MODE: "1"
      PS_DOMAIN: "192.168.10.247:8081"
      ADMIN_MAIL: "admin@example.com"
      ADMIN_PASSWD: "Admin123!"
      PS_FOLDER_ADMIN: "administration"
      PS_FOLDER_INSTALL: "install"
    volumes:
      - ps_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - selenoid1
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  prestashop_postinstall:
    image: alpine:3.19
    container_name: prestashop_postinstall
    restart: "no"
    depends_on:
      prestashop:
        condition: service_healthy
    volumes:
      - ps_data:/var/www/html
    command: >
        sh -lc '
          apk add --no-cache curl >/dev/null 2>&1 || true;

          echo "Waiting for PrestaShop HTTP to respond...";
          until curl -fsS http://prestashop/ >/dev/null; do sleep 5; done;

          echo "Waiting for config to exist...";
          until [ -f /var/www/html/config/settings.inc.php ] || [ -f /var/www/html/app/config/parameters.php ]; do sleep 2; done;

          echo "Extra grace period...";
          sleep 15;

          echo "Removing install folders...";
          rm -rf /var/www/html/install /var/www/html/install-dev || true;

          echo "Clearing cache...";
          rm -rf /var/www/html/var/cache/* || true;

          echo "Done."
        '
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - selenoid1

  tests:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tests
    volumes:
      - /mnt/d/Учеба/OTUS/OTUS_QA_Python_ver.2/page_object_test:/page_object_test
    depends_on:
      prestashop:
        condition: service_healthy
    networks:
      - selenoid1
    command: [ "pytest", "--headless"]

networks:
  selenoid1:
    name: selenoid1
    external: true
  selenoid2:
    name: selenoid2
    external: true

volumes:
  db_data:
    driver: local
  ps_data:
    driver: local
